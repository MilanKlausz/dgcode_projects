name: Build and publish documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub
# Pages. These were copied from workflows generated by the github UI.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba

    steps:
    - name: Checkout main repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ./src_co

    #we need a few files from .github in the simplebuild-dgcode repo:
    - name: Checkout simplebuild-dgcode repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: mctools/simplebuild-dgcode
        path: ./src_co_sbdgcode
        sparse-checkout: |
          .github

    - name: Setup conda environment
      uses: ./src_co_sbdgcode/.github/actions/setup
      with:
        PYTHON_VERSION: 3.11
        CACHED_NOARCH_DEF_PY_FILE: ./src_co_sbdgcode/.github/resources/cached_noarch_definitions.py
        CONDA_ENV_FILE : ./src_co_sbdgcode/.github/resources/conda-setup.yml

    - name: Install dgcode
      run: conda install --yes simple-build-dgcode

    - name: Update conda env for docs
      #NB: We do NOT add --prune in the next link, since
      #conda-setup_extra_for_docs.yml only contains the extra dependencies
      run: conda env update --name simplebuild_dgcode --file ./src_co_sbdgcode/.github/resources/conda-setup_extra_for_docs.yml

    - name: Build documentation
      #NB: -W to turn warnings into errors:
      run: make html SPHINXOPTS="-W"
      working-directory: ./src_co/doc/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: './src_co/doc/build/html'

    # NB: for robustness we do not run "make linkcheck" here, only in test-doc.yml.

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
