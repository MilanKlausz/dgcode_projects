name: docs
# Builds the documentation (doc/), warnings are errors. (Publishing, e.g. to GitHub Pages, is not set up yet.)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the documentation tools
        run: python3 -m pip install -r doc/requirements.txt

      - name: Build the documentation
        run: make html SPHINXOPTS="-W --keep-going"
        working-directory: ./doc/
