# The setups of the LoKI detector test with an AmBe source (October 2026, proposal 336349), as simulation parameters
# of sb_lokiambe_sim. Read by python/Setups.py: the parameters of a setup are those of [common], then the absorber
# strips and plates that were on the detector in that setup (joined with ';' in the order of this file), then the
# parameters of the setup itself (a parameter given in the setup replaces the common one).
#
# Geometry: the surveyed bank positions (SAM-606) with the rear bank at the depth of the measurement (detector
# carriage at 4999.96 mm), the middle banks 2 and 4 570 mm further downstream than in the survey (moved on their rails),
# the design B4C masks except the ones not on the detector during the test, the rear-bank calibration mask, air at
# atmospheric pressure, the aluminium detector vessel (25 mm wall), and the B4C sheets taped on the banks for the test.
# Source: the AmBe source in its HDPE moderator (26 cm diameter, 26 cm height), all neutron energies.

[common]
event_gen = "ambe"
spectrum_file = "ambe_hdpe_d26cm_h26cm_spectrum.txt"
max_energy_eV = "1e9"
rear_detector_distance_m = "9.985615"
bank_calibration = "2026-September-SAM-606"
bank_shifts_mm = "2:0,0,570;4:0,0,570"
boron_mask_banks = "all"
with_triangular_masks = "no"
boron_mask_exclude = "0:1,3,4,5;3:5,6,7;6:4,5,6,7;7:4,5,6,7;8:4,5,6,7"
with_rear_calibration_mask = "yes"
calibration_paint_thickness_mm = "0.30"
vacuum_tank_wall_mm = "25"
world_material = "G4_AIR"
pack_fill_material = "G4_AIR"
analysis_straw_pixel_number = "512"

# B4C sheets taped on the banks (1 mm natural B4C): absorber_strips / absorber_plates items of the geometry (see
